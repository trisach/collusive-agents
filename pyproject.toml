[project]
name = "collusive-agents"
version = "0.1.0"
readme = "README.md"
description = "Can ordinary task-claim actions carry coalition collusion when text is cut? (Apart AI Collusion Sprint, Track 3.1)"
requires-python = ">=3.11"
dependencies = [
    "modal>=1.6.2",
    "names>=0.3.0",  # Agent first names; same source and sampling as Terrarium.
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[dependency-groups]
analysis = [
    "matplotlib>=3.11.2",  # Paper figures (analysis/figures.py).
]
dev = [
    "ruff>=0.9.0",
]

[tool.uv]
default-groups = ["dev", "analysis"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/action_carriers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"analysis/*" = ["D"]
